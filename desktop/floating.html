<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CueFlow Floating Teleprompter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: transparent !important;
      background-color: transparent !important;
    }
    #container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      background-color: transparent;
      border: 1px solid transparent;
      box-shadow: none;
      transition: background-color 0.25s ease, border 0.25s ease;
    }

    /* Mode: Invisible (Default) */
    #container.mode-invisible {
      background-color: transparent !important;
      border: 1px dashed transparent;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }
    #container.mode-invisible:hover {
      border: 1px dashed rgba(255, 255, 255, 0.25);
    }

    /* Mode: Glass */
    #container.mode-glass {
      background-color: rgba(15, 23, 42, 0.35) !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
      backdrop-filter: blur(12px) !important;
    }

    /* Mode: Solid Dark */
    #container.mode-solid {
      background-color: rgba(15, 23, 42, 0.88) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65) !important;
      backdrop-filter: blur(20px) !important;
    }

    /* Header Bar */
    #header {
      height: 38px;
      background: rgba(10, 15, 28, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      cursor: move;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    #title-group {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }
    .badge {
      font-size: 10px;
      background: #0284C7;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .mode-badge {
      font-size: 10px;
      background: rgba(16, 185, 129, 0.25);
      border: 1px solid #10B981;
      color: #34D399;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
    }
    #title {
      font-size: 12px;
      font-weight: 600;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }
    .header-btns {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .btn {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #F8FAFC;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-toggle-active {
      background: #0284C7 !important;
      border-color: #38BDF8 !important;
      color: #FFFFFF !important;
    }
    .btn-close {
      background: #EF4444;
      border-color: #DC2626;
      color: white;
    }
    .btn-close:hover {
      background: #DC2626;
    }

    /* Content Area */
    #content-wrap {
      flex: 1;
      overflow-y: scroll;
      padding: 20px 18px;
      position: relative;
    }
    #content-wrap::-webkit-scrollbar {
      width: 4px;
    }
    #content-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }
    #content {
      white-space: pre-wrap;
      line-height: 1.65;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: 600;
      text-shadow:
        -1px -1px 0 rgba(0, 0, 0, 0.95),  
         1px -1px 0 rgba(0, 0, 0, 0.95),
        -1px  1px 0 rgba(0, 0, 0, 0.95),
         1px  1px 0 rgba(0, 0, 0, 0.95),
         0 2px 6px rgba(0, 0, 0, 0.95),
         0 0 14px rgba(0, 0, 0, 0.9);
      transition: font-size 0.1s;
    }
    .mirrored {
      transform: scaleX(-1);
    }

    /* Reading Guide Line */
    #reading-guide {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 45%;
      height: 2px;
      background: rgba(2, 132, 199, 0.55);
      box-shadow: 0 0 8px rgba(2, 132, 199, 0.7);
      pointer-events: none;
      display: none;
      z-index: 5;
    }

    /* Footer Controls */
    #footer {
      height: 42px;
      background: rgba(10, 15, 28, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      -webkit-app-region: no-drag;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .btn-play {
      background: #0284C7;
      border-color: #0369A1;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
    }
    .btn-play:hover {
      background: #0369A1;
    }

    /* Dedicated Speed Pills */
    .speed-pills {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 3px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-speed-pill {
      background: transparent;
      border: 1px solid transparent;
      color: #94A3B8;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-speed-pill:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
    }
    .btn-speed-pill.active {
      background: #0284C7 !important;
      border-color: #38BDF8 !important;
      color: #FFFFFF !important;
    }
    .btn-step {
      padding: 2px 6px;
      font-size: 12px;
      font-weight: 700;
      min-width: 22px;
      text-align: center;
    }
    .speed-tag {
      font-size: 11px;
      color: #38BDF8;
      font-weight: 700;
      min-width: 28px;
      text-align: center;
      padding: 0 2px;
    }

    /* Resize Handle */
    #resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      -webkit-app-region: no-drag;
      background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.4) 50%);
      z-index: 20;
    }

    /* Auto-Hide Controls when Inactive in Invisible Mode */
    .controls-faded #header,
    .controls-faded #footer {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container" class="mode-invisible">
    <div id="reading-guide"></div>

    <div id="header">
      <div id="title-group">
        <span class="badge">PROMPTER</span>
        <span id="mode-badge" class="mode-badge">👻 INVISIBLE</span>
        <span id="title">CueFlow Invisible Overlay</span>
      </div>
      <div class="header-btns">
        <button class="btn" id="btn-mode" title="Switch Mode: Invisible / Glass / Solid">👻 Mode</button>
        <button class="btn" id="btn-guide" title="Toggle Reading Guide Line">━ Line</button>
        <button class="btn" id="btn-mirror" title="Toggle Mirror Mode">⇋ Flip</button>
        <button class="btn btn-close" id="btn-close" title="Close Overlay">✕</button>
      </div>
    </div>

    <div id="content-wrap">
      <div id="content">Loading script...</div>
      <div style="height: 380px;"></div>
    </div>

    <div id="footer">
      <div class="controls">
        <button class="btn btn-play" id="btn-play">▶ Play</button>
        <button class="btn" id="btn-rewind" title="Rewind to Top">↺ Top</button>

        <!-- Speed Selection: 1X, 2X, 3X, 4X, 5X Pills + Fine Stepper -->
        <div class="speed-pills">
          <button class="btn-speed-pill" data-speed="1">1X</button>
          <button class="btn-speed-pill active" data-speed="2">2X</button>
          <button class="btn-speed-pill" data-speed="3">3X</button>
          <button class="btn-speed-pill" data-speed="4">4X</button>
          <button class="btn-speed-pill" data-speed="5">5X</button>
          <button class="btn btn-step" id="btn-slower" title="Decrease Speed by 0.5x">−</button>
          <span class="speed-tag" id="speed-label">2X</span>
          <button class="btn btn-step" id="btn-faster" title="Increase Speed by 0.5x">+</button>
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="btn-font-minus" title="Smaller Font">A-</button>
        <button class="btn" id="btn-font-plus" title="Larger Font">A+</button>
      </div>
    </div>

    <div id="resize-handle"></div>
  </div>

  <script>
    let ipc = null;
    try {
      const electron = require('electron');
      ipc = electron.ipcRenderer;
    } catch (e) {
      console.warn('Electron IPC not available directly');
    }

    const DEFAULT_GUIDE_TEXT = 
      "CueFlow Floating Teleprompter (Invisible Mode)\n\n" +
      "• Drag this window by the top header bar anywhere over your camera or meeting app.\n" +
      "• Spacebar or '▶ Play' button starts and pauses smooth scrolling.\n" +
      "• Click 1X or 2X to read at a relaxed speaking pace.\n" +
      "• The background is 100% invisible so only the text floats over your screen.\n" +
      "• Move your mouse over this window anytime to show controls.\n\n" +
      "You are ready to deliver your presentation with full confidence!";

    let config = {};
    let isPlaying = false;
    let speed = 2.0; // Default comfortable reading speed (2X)
    let userAdjustedSpeed = false;
    let fontSize = 24;
    let isMirrored = false;
    let showGuide = false;
    let animId = null;
    let lastTime = performance.now();
    let hideTimer = null;

    // Modes: 'invisible' (0% opacity, borderless) -> 'glass' (frosted 35%) -> 'solid' (88%)
    const modes = ['invisible', 'glass', 'solid'];
    let modeIdx = 0; // Starts in 'invisible' mode

    const container = document.getElementById('container');
    const wrap = document.getElementById('content-wrap');
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('title');
    const playBtn = document.getElementById('btn-play');
    const speedLabel = document.getElementById('speed-label');
    const modeBadge = document.getElementById('mode-badge');
    const readingGuide = document.getElementById('reading-guide');
    const speedPills = document.querySelectorAll('.btn-speed-pill');

    function updateSpeedUI() {
      // Format: integer like "1X", "2X", or decimal like "1.5X"
      const formatted = (speed % 1 === 0) ? `${speed}X` : `${speed.toFixed(1)}X`;
      speedLabel.textContent = formatted;

      // Update pill active classes
      speedPills.forEach(pill => {
        const pillVal = parseFloat(pill.getAttribute('data-speed'));
        if (pillVal === speed) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });
    }

    function setSpeed(newSpeed) {
      userAdjustedSpeed = true;
      // Allow speed between 0.5x and 15x
      speed = Math.max(0.5, Math.min(15, Math.round(newSpeed * 2) / 2));
      updateSpeedUI();
    }

    // Attach click listener to each speed pill: 1X, 2X, 3X, 4X, 5X
    speedPills.forEach(pill => {
      pill.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = parseFloat(pill.getAttribute('data-speed'));
        setSpeed(val);
      });
    });

    document.getElementById('btn-slower').onclick = (e) => {
      e.stopPropagation();
      setSpeed(speed - 0.5);
    };

    document.getElementById('btn-faster').onclick = (e) => {
      e.stopPropagation();
      setSpeed(speed + 0.5);
    };

    function applyMode(mode) {
      container.classList.remove('mode-invisible', 'mode-glass', 'mode-solid');
      container.classList.add(`mode-${mode}`);

      if (mode === 'invisible') {
        modeBadge.textContent = '👻 INVISIBLE';
        modeBadge.style.color = '#34D399';
        modeBadge.style.borderColor = '#10B981';
      } else if (mode === 'glass') {
        modeBadge.textContent = '🪟 GLASS';
        modeBadge.style.color = '#38BDF8';
        modeBadge.style.borderColor = '#0284C7';
      } else {
        modeBadge.textContent = '⬛ SOLID';
        modeBadge.style.color = '#F8FAFC';
        modeBadge.style.borderColor = '#64748B';
      }
    }

    function resetHideTimer() {
      container.classList.remove('controls-faded');
      clearTimeout(hideTimer);
      if (modeIdx === 0 && isPlaying) {
        hideTimer = setTimeout(() => {
          container.classList.add('controls-faded');
        }, 2500);
      }
    }

    window.addEventListener('mousemove', resetHideTimer);
    window.addEventListener('mouseenter', () => {
      container.classList.remove('controls-faded');
    });

    window.initOverlay = function(data) {
      if (!data) return;
      config = data;
      titleEl.textContent = config.title || 'CueFlow Overlay';

      const text = (config.content && config.content.trim().length > 0)
        ? config.content
        : DEFAULT_GUIDE_TEXT;
      contentEl.textContent = text;

      // Only take speed from config if user hasn't explicitly set it
      if (!userAdjustedSpeed) {
        if (typeof config.speed === 'number' && config.speed > 0) {
          speed = Math.max(0.5, Math.min(15, config.speed));
        } else {
          speed = 2.0; // Default to smooth 2X
        }
      }
      updateSpeedUI();

      fontSize = Math.max(16, Math.min(60, config.fontSize || 24));
      isMirrored = !!config.mirrorMode;

      contentEl.style.fontSize = fontSize + 'px';
      if (config.textColor) contentEl.style.color = config.textColor;

      if (typeof config.opacity === 'number') {
        if (config.opacity <= 0.1) {
          modeIdx = 0; // invisible
        } else if (config.opacity <= 0.5) {
          modeIdx = 1; // glass
        } else {
          modeIdx = 2; // solid
        }
      }
      applyMode(modes[modeIdx]);

      if (isMirrored) {
        contentEl.classList.add('mirrored');
      } else {
        contentEl.classList.remove('mirrored');
      }

      if (config.scrollPosition) {
        wrap.scrollTop = config.scrollPosition;
        floatScrollPos = config.scrollPosition;
      }
    };

    if (ipc) {
      ipc.on('init-overlay', (event, data) => {
        window.initOverlay(data);
      });
      ipc.invoke('overlay:getConfig').then(data => {
        if (data && (data.content || data.title)) {
          window.initOverlay(data);
        } else {
          window.initOverlay({ content: DEFAULT_GUIDE_TEXT });
        }
      }).catch(() => {
        window.initOverlay({ content: DEFAULT_GUIDE_TEXT });
      });
    } else {
      window.initOverlay({ content: DEFAULT_GUIDE_TEXT });
    }

    let floatScrollPos = 0;

    wrap.addEventListener('scroll', () => {
      if (!isPlaying) {
        floatScrollPos = wrap.scrollTop;
      }
    });

    function togglePlay() {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      playBtn.style.backgroundColor = isPlaying ? '#10B981' : '#0284C7';
      if (isPlaying) {
        floatScrollPos = wrap.scrollTop;
        lastTime = performance.now();
        animId = requestAnimationFrame(scrollStep);
        resetHideTimer();
      } else {
        cancelAnimationFrame(animId);
        container.classList.remove('controls-faded');
        clearTimeout(hideTimer);
      }
    }

    function scrollStep(time) {
      if (!isPlaying) return;
      const delta = (time - lastTime) / 1000;
      lastTime = time;

      // Calibrated speeds in pixels per second:
      // 1X = 24 px/s (steady, calm presentation pace)
      // 2X = 44 px/s (natural conversational presentation pace)
      // 3X = 66 px/s (brisk speaker pace)
      // 4X = 90 px/s (fast pace)
      // 5X = 120 px/s (quick review pace)
      const pxPerSec = speed <= 1 ? 24 * speed : 24 + (speed - 1) * 20;
      floatScrollPos += pxPerSec * delta;
      wrap.scrollTop = floatScrollPos;

      if (ipc) {
        ipc.send('overlay-scrolled', {
          scrollPosition: wrap.scrollTop,
          totalHeight: wrap.scrollHeight
        });
      }

      if (wrap.scrollTop < wrap.scrollHeight - wrap.clientHeight - 2) {
        animId = requestAnimationFrame(scrollStep);
      } else {
        isPlaying = false;
        playBtn.textContent = '▶ Play';
        playBtn.style.backgroundColor = '#0284C7';
        container.classList.remove('controls-faded');
      }
    }

    playBtn.onclick = togglePlay;

    wrap.onclick = (e) => {
      if (e.target === contentEl || e.target === wrap) {
        togglePlay();
      }
    };

    document.getElementById('btn-mode').onclick = () => {
      modeIdx = (modeIdx + 1) % modes.length;
      applyMode(modes[modeIdx]);
      resetHideTimer();
    };

    document.getElementById('btn-guide').onclick = () => {
      showGuide = !showGuide;
      readingGuide.style.display = showGuide ? 'block' : 'none';
      document.getElementById('btn-guide').classList.toggle('btn-toggle-active', showGuide);
    };

    document.getElementById('btn-rewind').onclick = () => {
      wrap.scrollTop = 0;
      floatScrollPos = 0;
    };

    document.getElementById('btn-close').onclick = () => {
      if (ipc) {
        ipc.send('close-overlay-window');
      } else {
        window.close();
      }
    };

    document.getElementById('btn-font-plus').onclick = () => {
      fontSize = Math.min(60, fontSize + 2);
      contentEl.style.fontSize = fontSize + 'px';
    };

    document.getElementById('btn-font-minus').onclick = () => {
      fontSize = Math.max(16, fontSize - 2);
      contentEl.style.fontSize = fontSize + 'px';
    };

    document.getElementById('btn-mirror').onclick = () => {
      isMirrored = !isMirrored;
      if (isMirrored) {
        contentEl.classList.add('mirrored');
        document.getElementById('btn-mirror').classList.add('btn-toggle-active');
      } else {
        contentEl.classList.remove('mirrored');
        document.getElementById('btn-mirror').classList.remove('btn-toggle-active');
      }
    };

    // Keyboard controls in overlay
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowUp') {
        setSpeed(speed + 0.5);
      } else if (e.code === 'ArrowDown') {
        setSpeed(speed - 0.5);
      } else if (e.code === 'Digit1') {
        setSpeed(1.0);
      } else if (e.code === 'Digit2') {
        setSpeed(2.0);
      } else if (e.code === 'Digit3') {
        setSpeed(3.0);
      } else if (e.code === 'Digit4') {
        setSpeed(4.0);
      } else if (e.code === 'Digit5') {
        setSpeed(5.0);
      } else if (e.code === 'KeyI') {
        modeIdx = (modeIdx + 1) % modes.length;
        applyMode(modes[modeIdx]);
      } else if (e.code === 'KeyF') {
        document.getElementById('btn-mirror').click();
      } else if (e.code === 'Escape') {
        if (ipc) ipc.send('close-overlay-window');
      }
    });
  </script>
</body>
</html>
