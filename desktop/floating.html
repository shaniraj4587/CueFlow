<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CueFlow Floating Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
    }
    #container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
    }
    #header {
      height: 38px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      -webkit-app-region: drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    #title {
      font-size: 13px;
      font-weight: 600;
      color: #F8FAFC;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }
    .header-btns {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #F8FAFC;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    .btn-close {
      background: #EF4444;
      color: white;
    }
    .btn-close:hover {
      background: #DC2626;
    }
    #content-wrap {
      flex: 1;
      overflow-y: scroll;
      padding: 20px 16px;
      position: relative;
    }
    #content-wrap::-webkit-scrollbar {
      width: 4px;
    }
    #content-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }
    #content {
      white-space: pre-wrap;
      line-height: 1.6;
      color: #F8FAFC;
    }
    .mirrored {
      transform: scaleX(-1);
    }
    #footer {
      height: 38px;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      -webkit-app-region: no-drag;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .speed-tag {
      font-size: 11px;
      color: #94A3B8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="header">
      <span id="title">CueFlow Overlay</span>
      <div class="header-btns">
        <button class="btn" id="btn-mirror" title="Toggle Mirror">⇋ Flip</button>
        <button class="btn btn-close" id="btn-close" title="Close">✕</button>
      </div>
    </div>
    <div id="content-wrap">
      <div id="content"></div>
      <div style="height: 300px;"></div>
    </div>
    <div id="footer">
      <div class="controls">
        <button class="btn" id="btn-play">▶ Play</button>
        <button class="btn" id="btn-slower">-</button>
        <span class="speed-tag" id="speed-label">3x</span>
        <button class="btn" id="btn-faster">+</button>
      </div>
      <div class="controls">
        <button class="btn" id="btn-font-minus">A-</button>
        <button class="btn" id="btn-font-plus">A+</button>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    let config = {};
    let isPlaying = false;
    let speed = 3;
    let fontSize = 24;
    let isMirrored = false;
    let scrollPos = 0;
    let animId = null;

    const wrap = document.getElementById('content-wrap');
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('title');
    const playBtn = document.getElementById('btn-play');
    const speedLabel = document.getElementById('speed-label');
    const container = document.getElementById('container');

    ipcRenderer.on('init-overlay', (event, data) => {
      config = data || {};
      titleEl.textContent = config.title || 'CueFlow Overlay';
      contentEl.textContent = config.content || '';
      speed = Math.max(1, Math.min(20, config.speed || 3));
      fontSize = Math.max(16, Math.min(60, config.fontSize || 24));
      isMirrored = !!config.mirrorMode;

      contentEl.style.fontSize = fontSize + 'px';
      if (config.textColor) contentEl.style.color = config.textColor;
      if (config.opacity) {
        container.style.backgroundColor = `rgba(15, 23, 42, ${Math.max(0.2, config.opacity)})`;
      }
      if (isMirrored) contentEl.classList.add('mirrored');

      speedLabel.textContent = speed + 'x';

      if (config.scrollPosition) {
        wrap.scrollTop = config.scrollPosition;
      }
    });

    function togglePlay() {
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      if (isPlaying) {
        lastTime = performance.now();
        animId = requestAnimationFrame(scrollStep);
      } else {
        cancelAnimationFrame(animId);
      }
    }

    let lastTime = performance.now();
    function scrollStep(time) {
      if (!isPlaying) return;
      const delta = (time - lastTime) / 1000;
      lastTime = time;
      
      const pxPerSec = speed * 28;
      wrap.scrollTop += pxPerSec * delta;

      ipcRenderer.send('overlay-scrolled', {
        scrollPosition: wrap.scrollTop,
        totalHeight: wrap.scrollHeight
      });

      if (wrap.scrollTop < wrap.scrollHeight - wrap.clientHeight) {
        animId = requestAnimationFrame(scrollStep);
      } else {
        isPlaying = false;
        playBtn.textContent = '▶ Play';
      }
    }

    playBtn.onclick = togglePlay;
    document.getElementById('btn-close').onclick = () => {
      ipcRenderer.send('close-overlay-window');
    };

    document.getElementById('btn-faster').onclick = () => {
      speed = Math.min(20, speed + 1);
      speedLabel.textContent = speed + 'x';
    };

    document.getElementById('btn-slower').onclick = () => {
      speed = Math.max(1, speed - 1);
      speedLabel.textContent = speed + 'x';
    };

    document.getElementById('btn-font-plus').onclick = () => {
      fontSize = Math.min(60, fontSize + 2);
      contentEl.style.fontSize = fontSize + 'px';
    };

    document.getElementById('btn-font-minus').onclick = () => {
      fontSize = Math.max(16, fontSize - 2);
      contentEl.style.fontSize = fontSize + 'px';
    };

    document.getElementById('btn-mirror').onclick = () => {
      isMirrored = !isMirrored;
      if (isMirrored) {
        contentEl.classList.add('mirrored');
      } else {
        contentEl.classList.remove('mirrored');
      }
    };
  </script>
</body>
</html>
